<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f1e8">
<title>Pebble's Adventure Journal</title>
<style>
:root{
  --paper:#f5f1e8; --card:#fffdf8; --ink:#263128; --muted:#69736a;
  --line:#d9d4c7; --accent:#5d745e; --accent2:#8c9f7c; --warm:#c49b68;
  --shadow:0 8px 28px rgba(38,49,40,.08); --radius:20px;
}
*{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.app{max-width:900px;margin:auto;padding:20px 16px 40px}
header{padding:12px 2px 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-family:Georgia,serif;font-size:34px;line-height:1.05;margin:5px 0 0}
.subtitle{color:var(--muted);margin-top:7px}
.primary{border:0;background:var(--accent);color:white;border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,#e4eadc,#f8f2e5);border:1px solid var(--line);border-radius:26px;padding:20px;display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:20px}
.hero h2{font-family:Georgia,serif;margin:0 0 6px;font-size:25px}.hero p{margin:0;color:var(--muted);max-width:550px}
.paw{font-size:52px;opacity:.65}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 12px}
.section-head h2{font-family:Georgia,serif;font-size:22px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);cursor:pointer}
.photo{height:170px;background:linear-gradient(135deg,#c8d2bd,#e9dfca);display:flex;align-items:center;justify-content:center;color:#66705f;font-size:38px}
.photo img{width:100%;height:100%;object-fit:cover}.cardbody{padding:15px}
.cardbody h3{margin:0 0 5px;font-family:Georgia,serif;font-size:21px}.meta{font-size:13px;color:var(--muted);line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#e9eee4;color:#526352}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:18px;padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(30,37,31,.42);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10}.modal.open{display:flex}
.sheet{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--card);border-radius:24px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.2)}
.sheet h2{font-family:Georgia,serif;margin:0 0 16px}.close{float:right;border:0;background:#eee9de;border-radius:50%;width:36px;height:36px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:12px;padding:11px;background:white;color:var(--ink)}
textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.secondary{border:1px solid var(--line);background:#f3efe6;border-radius:999px;padding:11px 15px}
.detail-photo{height:260px;border-radius:16px;overflow:hidden;background:#e4eadc;display:flex;align-items:center;justify-content:center;font-size:50px;margin-bottom:16px}.detail-photo img{width:100%;height:100%;object-fit:cover}
.detail h2{font-family:Georgia,serif;font-size:29px;margin:0 0 5px}.detail-meta{color:var(--muted);line-height:1.7}.notes{margin-top:16px;padding:15px;background:#f4f0e6;border-radius:15px;white-space:pre-wrap}
@media(max-width:620px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.hero{padding:17px}.paw{font-size:40px}.photo{height:190px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><div class="eyebrow">Pebble's outdoor life</div><h1>Adventure Journal</h1><div class="subtitle">A little record of the trails, miles & memories.</div></div>
  <button class="primary" id="addAdventureBtn" type="button" onclick="openAdd()">+ Adventure</button>
</header>

<section class="hero">
  <div><h2>Keep the good miles.</h2><p>Catalog Pebble's adventures like a nature journal—not a fitness tracker.</p></div>
  <div class="paw">🐾</div>
</section>

<div class="stats">
  <div class="stat"><b id="totalMiles">0</b><span>Total miles</span></div>
  <div class="stat"><b id="totalTrips">0</b><span>Adventures</span></div>
  <div class="stat"><b id="trailCount">0</b><span>Trails explored</span></div>
</div>

<div class="section-head"><h2>Recent adventures</h2></div>
<div id="cards" class="grid"></div>
</div>

<div id="modal" class="modal" id="modal">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const KEY = "pebble-adventures-v2";
let adventures = [];
let editingId = null;

function loadData() {
  try {
    adventures = JSON.parse(localStorage.getItem(KEY) || "[]");
    if (!Array.isArray(adventures)) adventures = [];
  } catch (e) {
    adventures = [];
  }
}

function setStatus(message, isError=false) {
  let el = document.getElementById("formStatus");
  if (!el) {
    el = document.createElement("div");
    el.id = "formStatus";
    el.style.cssText = "margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;background:#f3efe6;color:#69736a;";
    const actions = document.querySelector(".actions");
    if (actions) actions.parentNode.insertBefore(el, actions);
  }
  el.textContent = message || "";
  el.style.background = isError ? "#f7e4df" : "#f3efe6";
  el.style.color = isError ? "#8a3d2f" : "#69736a";
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(adventures));
    render();
    return true;
  } catch (e) {
    setStatus("The photo is too large for the journal's storage. Try a smaller photo.", true);
    return false;
  }
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function fmtDate(d) {
  if (!d) return "";
  return new Date(d + "T12:00:00").toLocaleDateString(undefined,{
    month:"short",day:"numeric",year:"numeric"
  });
}

function render() {
  const miles = adventures.reduce((a,x)=>a+(parseFloat(x.distance)||0),0);
  const trails = new Set(adventures.map(x=>(x.trail||"").trim().toLowerCase()).filter(Boolean));
  document.getElementById("totalMiles").textContent = miles.toFixed(1);
  document.getElementById("totalTrips").textContent = adventures.length;
  document.getElementById("trailCount").textContent = trails.size;

  const el = document.getElementById("cards");
  if (!adventures.length) {
    el.innerHTML = '<div class="empty">No adventures yet.<br>Add Pebble\\'s first trail and start the journal.</div>';
    return;
  }

  el.innerHTML = adventures.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(x=>`
    <article class="card" onclick="openDetail('${esc(x.id)}')">
      <div class="photo">${x.photo ? `<img src="${x.photo}" alt="">` : "🌲"}</div>
      <div class="cardbody">
        <h3>${esc(x.trail || "Unnamed trail")}</h3>
        <div class="meta">${fmtDate(x.date)} · ${esc(x.distance || "0")} mi · ${esc(x.surface || "")}</div>
        <div class="tags">
          ${x.duration ? `<span class="tag">${esc(x.duration)}</span>` : ""}
          ${x.mood ? `<span class="tag">Pebble: ${esc(x.mood)}</span>` : ""}
        </div>
      </div>
    </article>`).join("");
}

function openAdd() {
  editingId = null;
  openForm(null);
}

function openEdit(id) {
  const x = adventures.find(a=>a.id===id);
  if (x) {
    editingId = id;
    openForm(x);
  }
}

function openForm(x) {
  const isEdit = !!x;
  const currentDate = x?.date || new Date().toISOString().slice(0,10);
  document.getElementById("sheet").innerHTML = `
    <button class="close" id="closeModalBtn" type="button">×</button>
    <h2>${isEdit ? "Edit adventure" : "New adventure"}</h2>
    <div class="formgrid">
      <div class="field"><label>Trail / location</label><input id="trail" value="${esc(x?.trail||"")}" placeholder="Wincopin Trails"></div>
      <div class="field"><label>Date</label><input id="date" type="date" value="${currentDate}"></div>
      <div class="field"><label>Distance (miles)</label><input id="distance" type="number" step="0.01" value="${esc(x?.distance||"")}" placeholder="3.44"></div>
      <div class="field"><label>Surface</label><select id="surface">
        ${["Natural","Gravel","Mixed","Paved"].map(v=>`<option ${x?.surface===v?"selected":""}>${v}</option>`).join("")}
      </select></div>
      <div class="field"><label>Duration</label><input id="duration" value="${esc(x?.duration||"")}" placeholder="1 hr 20 min"></div>
      <div class="field"><label>Pebble's mood</label><input id="mood" value="${esc(x?.mood||"")}" placeholder="Happy / curious / chaotic"></div>
      <div class="field full"><label>Photo ${isEdit && x?.photo ? "(choose a new one to replace it)" : "(optional)"}</label><input id="photo" type="file" accept="image/*"></div>
      ${isEdit && x?.photo ? `<div class="field full"><button class="secondary" type="button" id="removePhotoBtn">Remove current photo</button></div>` : ""}
      <div class="field full"><label>Notes</label><textarea id="notes" placeholder="What did Pebble do? What did you notice?">${esc(x?.notes||"")}</textarea></div>
    </div>
    <div id="formStatus" style="margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13px;background:#f3efe6;color:#69736a;">${isEdit ? "Changes are saved only when you tap Save changes." : ""}</div>
    <div class="actions">
      <button class="secondary" id="cancelBtn" type="button">Cancel</button>
      <button class="primary" id="saveAdventureBtn" type="button">${isEdit ? "Save changes" : "Save adventure"}</button>
    </div>`;
  document.getElementById("modal").classList.add("open");

  const removeBtn = document.getElementById("removePhotoBtn");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    const target = adventures.find(a=>a.id===editingId);
    if (target) target._removePhoto = true;
    setStatus("Current photo will be removed when you save.");
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve("");
    if (!file.type.startsWith("image/")) return reject(new Error("Please choose an image file."));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("The photo could not be read."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("The photo could not be opened."));
      img.onload = () => {
        const max = 1400;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        let quality = 0.78;
        let data = canvas.toDataURL("image/jpeg", quality);
        // Keep localStorage usage modest.
        while (data.length > 850000 && quality > 0.45) {
          quality -= 0.08;
          data = canvas.toDataURL("image/jpeg", quality);
        }
        resolve(data);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function saveAdventure() {
  const btn = document.getElementById("saveAdventureBtn");
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = editingId ? "Saving…" : "Saving…";
  setStatus("Saving your adventure…");

  try {
    const trail = document.getElementById("trail").value.trim();
    const date = document.getElementById("date").value;
    const distance = document.getElementById("distance").value;
    const surface = document.getElementById("surface").value;
    const duration = document.getElementById("duration").value.trim();
    const mood = document.getElementById("mood").value.trim();
    const notes = document.getElementById("notes").value.trim();
    const file = document.getElementById("photo").files[0];

    if (!trail) {
      setStatus("Please enter a trail or location.", true);
      btn.disabled = false; btn.textContent = editingId ? "Save changes" : "Save adventure";
      return;
    }
    if (!date) {
      setStatus("Please choose a date.", true);
      btn.disabled = false; btn.textContent = editingId ? "Save changes" : "Save adventure";
      return;
    }

    let target = editingId ? adventures.find(a=>a.id===editingId) : null;
    if (!target) {
      target = {id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())), photo:""};
      adventures.push(target);
    }

    target.trail = trail;
    target.date = date;
    target.distance = distance;
    target.surface = surface;
    target.duration = duration;
    target.mood = mood;
    target.notes = notes;

    if (target._removePhoto) {
      target.photo = "";
      delete target._removePhoto;
    }

    if (file) target.photo = await compressImage(file);

    if (!persist()) {
      // If storage fails, don't lose the user's form entry; remove only a newly created blank record.
      if (!editingId) adventures = adventures.filter(a=>a!==target);
      return;
    }

    closeModal();
  } catch (e) {
    setStatus(e.message || "The adventure could not be saved. Please try again.", true);
    btn.disabled = false;
    btn.textContent = editingId ? "Save changes" : "Save adventure";
  }
}

function openDetail(id) {
  const x = adventures.find(a=>a.id===id);
  if (!x) return;
  document.getElementById("sheet").innerHTML = `
    <button class="close" id="closeModalBtn" type="button">×</button>
    <div class="detail">
      <div class="detail-photo">${x.photo ? `<img src="${x.photo}" alt="">` : "🌲"}</div>
      <div class="eyebrow">${esc(x.surface||"Trail")} · ${fmtDate(x.date)}</div>
      <h2>${esc(x.trail||"Unnamed adventure")}</h2>
      <div class="detail-meta"><b>${esc(x.distance||"0")} mi</b>${x.duration?" · "+esc(x.duration):""}${x.mood?" · Pebble was "+esc(x.mood):""}</div>
      ${x.notes?`<div class="notes">${esc(x.notes)}</div>`:""}
      <div class="actions">
        <button class="secondary" id="deleteBtn" type="button">Delete</button>
        <button class="secondary" id="editBtn" type="button">Edit</button>
        <button class="primary" id="doneBtn" type="button">Done</button>
      </div>
    </div>`;
  document.getElementById("modal").classList.add("open");
  document.getElementById("editBtn").onclick = () => openEdit(x.id);
  document.getElementById("deleteBtn").onclick = () => deleteAdventure(x.id);
  document.getElementById("doneBtn").onclick = closeModal;
}

function deleteAdventure(id) {
  if (confirm("Delete this adventure?")) {
    adventures = adventures.filter(x=>x.id!==id);
    persist();
    closeModal();
  }
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  editingId = null;
}

document.addEventListener("DOMContentLoaded", () => {
  loadData();
  render();

  document.getElementById("addAdventureBtn").addEventListener("click", openAdd);
  document.getElementById("modal").addEventListener("click", e => {
    if (e.target.id === "modal") closeModal();
  });

  document.addEventListener("click", e => {
    if (e.target.id === "saveAdventureBtn") saveAdventure();
    if (e.target.id === "closeModalBtn" || e.target.id === "cancelBtn") closeModal();
  });
});
</script>

</body>
</html>
